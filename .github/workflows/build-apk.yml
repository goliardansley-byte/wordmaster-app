name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Java 17 compatibility in Gradle
        working-directory: ./android
        run: |
          # 在 gradle.properties 中设置 Java 工具链版本
          echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          # 修改所有模块的 build.gradle 中的 Java 版本（如果存在）
          find . -name "build.gradle" -type f -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} \;
          find . -name "build.gradle" -type f -exec sed -i 's/sourceCompatibility = 21/sourceCompatibility = 17/g' {} \;
          find . -name "build.gradle" -type f -exec sed -i 's/targetCompatibility = 21/targetCompatibility = 17/g' {} \;

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Clean Android project
        working-directory: ./android
        run: ./gradlew clean

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ./android/app/build/outputs/apk/debug/app-debug.apk