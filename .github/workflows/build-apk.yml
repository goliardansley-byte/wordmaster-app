name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Java 17 in Capacitor libraries
        working-directory: ./android
        run: |
          echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          
          # 修改 capacitor-android 的 build.gradle
          if [ -f capacitor-android/build.gradle ]; then
            sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' capacitor-android/build.gradle
            sed -i 's/sourceCompatibility = 21/sourceCompatibility = 17/g' capacitor-android/build.gradle
            sed -i 's/targetCompatibility = 21/targetCompatibility = 17/g' capacitor-android/build.gradle
          fi
          
          # 修改 capacitor-cordova-android-plugins 的 build.gradle
          if [ -f capacitor-cordova-android-plugins/build.gradle ]; then
            sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' capacitor-cordova-android-plugins/build.gradle
            sed -i 's/sourceCompatibility = 21/sourceCompatibility = 17/g' capacitor-cordova-android-plugins/build.gradle
            sed -i 's/targetCompatibility = 21/targetCompatibility = 17/g' capacitor-cordova-android-plugins/build.gradle
          fi
          
          # 确保 app/build.gradle 中也使用 Java 17
          if [ -f app/build.gradle ]; then
            sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' app/build.gradle
            sed -i 's/sourceCompatibility = 21/sourceCompatibility = 17/g' app/build.gradle
            sed -i 's/targetCompatibility = 21/targetCompatibility = 17/g' app/build.gradle
          fi

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Clean Android project
        working-directory: ./android
        run: ./gradlew clean

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ./android/app/build/outputs/apk/debug/app-debug.apk